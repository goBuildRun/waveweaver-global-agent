<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WaveWeaver Twitch Overlay</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    html, body { margin: 0; min-height: 100%; background: transparent; overflow: hidden; }
    #root { width: min(720px, 96vw); margin: 22px auto; }
    .panel { padding: 20px; border: 1px solid rgba(255,255,255,.2); border-radius: 16px; background: rgba(14,14,16,.9); color: #fff; box-shadow: 0 14px 40px rgba(0,0,0,.34); }
    .eyebrow { color: #c4b5fd; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 4px 0 14px; font-size: clamp(24px, 5vw, 42px); line-height: 1.05; }
    .poll-question { margin: 0 0 12px; font-size: 18px; font-weight: 700; }
    .option { margin: 10px 0; }
    .option-row { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
    .track { height: 10px; margin-top: 5px; border-radius: 5px; background: #27272a; overflow: hidden; }
    .fill { height: 100%; background: linear-gradient(90deg, #9146ff, #22d3ee); transition: width .25s ease; }
    .meter { height: 16px; margin-top: 8px; border-radius: 8px; background: #27272a; overflow: hidden; }
    .meter-fill { height: 100%; background: linear-gradient(90deg, #f59e0b, #ef4444); transition: width .25s ease; }
    .muted { color: #a1a1aa; font-size: 13px; }
    #alert { display: none; border-left: 8px solid #9146ff; }
    #alert.show { display: block; animation: pop .35s ease-out; }
    #alert-subline { margin-top: 5px; color: #d4d4d8; }
    @keyframes pop { from { transform: scale(.94); opacity: .3; } to { transform: scale(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main id="root" aria-live="polite">
    <section id="alert" class="panel" aria-label="Stream alert">
      <div id="alert-eyebrow" class="eyebrow">Codex approved alert</div>
      <h1 id="alert-headline"></h1>
      <div id="alert-subline"></div>
    </section>
    <section id="poll" class="panel" aria-label="Live chat poll" hidden>
      <div class="eyebrow">Chat vote</div>
      <p id="poll-question" class="poll-question"></p>
      <div id="poll-options"></div>
      <div id="poll-remaining" class="muted"></div>
    </section>
    <section id="hype" class="panel" aria-label="Hype meter" hidden>
      <div class="eyebrow">Hype meter</div>
      <div class="meter" role="progressbar" aria-label="Hype meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="hype-fill" class="meter-fill" style="width:0%"></div></div>
      <div id="hype-label" class="muted"></div>
    </section>
  </main>
  <script>
    const pollEl = document.getElementById('poll');
    const hypeEl = document.getElementById('hype');
    const alertEl = document.getElementById('alert');
    let renderedAlertId = null;
    const eventSource = new EventSource('/api/twitch/events?role=overlay');

    function renderPoll(poll) {
      if (!poll || !poll.active) { pollEl.hidden = true; return; }
      pollEl.hidden = false;
      document.getElementById('poll-question').textContent = poll.question;
      const total = poll.total_votes || 0;
      const options = document.getElementById('poll-options');
      options.replaceChildren();
      poll.options.forEach((option) => {
        const row = document.createElement('div');
        row.className = 'option';
        const label = document.createElement('div');
        label.className = 'option-row';
        const name = document.createElement('span');
        name.textContent = option;
        const count = document.createElement('span');
        count.textContent = String(poll.votes[option] || 0);
        label.append(name, count);
        const track = document.createElement('div');
        track.className = 'track';
        const fill = document.createElement('div');
        fill.className = 'fill';
        fill.style.width = `${total ? ((poll.votes[option] || 0) / total) * 100 : 0}%`;
        track.append(fill);
        row.append(label, track);
        options.append(row);
      });
      document.getElementById('poll-remaining').textContent = `${poll.remaining_seconds}s remaining · ${total} vote${total === 1 ? '' : 's'}`;
    }

    function renderHype(hype) {
      if (!hype) { hypeEl.hidden = true; return; }
      hypeEl.hidden = false;
      const score = Math.max(0, Math.min(hype.max || 100, Number(hype.score) || 0));
      const fill = document.getElementById('hype-fill');
      fill.style.width = `${score}%`;
      const meter = hypeEl.querySelector('[role=progressbar]');
      meter.setAttribute('aria-valuenow', String(score));
      document.getElementById('hype-label').textContent = `${score.toFixed(1)} / ${hype.max || 100}`;
    }

    function renderAlert(alert) {
      const spec = alert && alert.overlay && alert.overlay.spec;
      if (!spec) { alertEl.classList.remove('show'); return; }
      renderedAlertId = alert.alert_id || alert.approved_at || alert.created_at || null;
      document.getElementById('alert-headline').textContent = spec.headline;
      document.getElementById('alert-subline').textContent = spec.subline;
      document.getElementById('alert-eyebrow').textContent = `Codex approved · ${alert.highlight && alert.highlight.highlight_id || 'live alert'}`;
      alertEl.style.borderLeftColor = spec.accent_hex;
      alertEl.classList.remove('show');
      void alertEl.offsetWidth;
      alertEl.classList.add('show');
      window.setTimeout(() => alertEl.classList.remove('show'), Number(spec.duration_ms) || 4000);
    }

    function renderState(state) {
      renderPoll(state.poll);
      renderHype(state.hype);
      const approved = state.approved_alert;
      if (approved) {
        const alertId = approved.alert_id || approved.approved_at || approved.created_at || null;
        if (alertId !== renderedAlertId) renderAlert(approved);
      } else {
        renderedAlertId = null;
      }
    }

    eventSource.addEventListener('state', (event) => renderState(JSON.parse(event.data)));
    eventSource.addEventListener('alert.approved', (event) => renderAlert(JSON.parse(event.data)));
    eventSource.addEventListener('poll.updated', (event) => renderPoll(JSON.parse(event.data).poll));
    eventSource.addEventListener('poll.started', (event) => renderPoll(JSON.parse(event.data).poll));
    eventSource.addEventListener('poll.stopped', (event) => renderPoll(JSON.parse(event.data).poll));
    eventSource.addEventListener('hype.updated', (event) => renderHype(JSON.parse(event.data).hype));
  </script>
</body>
</html>
